name: Delivery Service CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  delivery-service:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build delivery service
        run: pnpm --filter delivery-service build

      - name: Run delivery unit/service tests
        run: pnpm --filter delivery-service test -- --testPathIgnorePatterns=redis-geo-driver.repository.int.spec.ts
        env:
          REDIS_URL: redis://localhost:6379

      - name: Run Redis integration tests
        run: pnpm --filter delivery-service test -- --runInBand --testPathPattern=redis-geo-driver.repository.int.spec.ts
        env:
          REDIS_URL: redis://localhost:6379
